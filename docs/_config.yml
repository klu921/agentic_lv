title: Long-Context Video Understanding Research
author: Research Team
email: email@domain.com
description: >-
  Research blog on long-context video understanding using LLMs and VLMs.
  Exploring agentic pipelines and critic modules for improved accuracy.

baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Permalink structure
permalink: /:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Research Team"